<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./futAndHed.css">
    <link rel="stylesheet" type="text/css" href="./registration.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Stick&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Marcellus&family=Play:wght@400;700&display=swap"
        rel="stylesheet">
    <title>Регистрация</title>
</head>

<body>
    <header>
        <nav class="headLeft">
            <a href="/">
                <img src="img/logo.png" alt="">
            </a>


    </header>
    <main>
        <div class="left-wall"></div>
        <div class="right-wall"></div>

        <div class="sds">
            <div>
                <h1>Регистрация аккаунта</h1>
                <hr>
            </div>
            <form action="/registration" method="post">
                <input type="text" name="nickname" id="" placeholder="Имя пользователя" required maxlength="20">
                <input type="email" name="email" id="email" placeholder="Почта" required
                    pattern="/^[a-zA-Z0-9.!#$%&’*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*$/">
                <input type="password" name="password" id="password" placeholder="Пароль" required minlength="6"
                    maxlength="20">
                <p id="error"></p>
                 <a class="b1" href="*"></a>
                <button id="sub" type="submit" disabled>Зарегистрироваться</button>
                <div class="goReg">
                    <p>Есть учетная запись?</p>
                    <a class="b1" href="authorization.html">Авторизироваться</a>
                </div>
            </form>
        </div>
    </main>
    <footer>
        <div class="fotCont">
            <div class="upFo">
                <img src="img/logo.png" alt="">
                <p>MangaHub</p>
            </div>
            <p> MangaHub © Все права защищены</p>
        </div>
    </footer>
    <button id="scrollToTop" style="display: none;">↑</button>

    <div id="scroll-overlay"></div>
    <script src="./scrol.js">

        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^\w\s]).{6,}$/
        document.getElementById('password').addEventListener('input', () => {
            if (!passwordRegex.test(document.getElementById('password').value)) {
                document.getElementById('error').textContent = 'Вы сделали пароль недостаточно сложным!';
                document.getElementById('sub').disabled = true;
            } else {
                document.getElementById('error').textContent = '';
                document.getElementById('sub').disabled = false;
            }
        });

        document.getElementById('email').addEventListener('change', () => {
            const getUser = async () => {
                const res = await fetch('/getUser');
                const userData = await res.json();

                if (userData.email == document.getElementById('email').value) {
                    document.getElementById('error').textContent = 'Пользователь с такой почтой уже существует!';
                    document.getElementById('sub').disabled = true;
                } else {
                    document.getElementById('error').textContent = '';
                    document.getElementById('sub').disabled = false;
                }
            }

            getUser();
        })
    </script>

</body>

</html>
